<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BlogScraper</title>
<style>
  :root {
    --bg: #121212;
    --panel: #1a1a1a;
    --border: #2e2e2e;
    --text: #e8e8e8;
    --muted: #8a8a8a;
    --accent: #4da6ff;
    --error: #ff6b6b;
    --ok: #5fd68a;
    --space-1: 8px;
    --space-2: 16px;
    --space-3: 24px;
    --space-4: 32px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  main {
    max-width: 720px;
    margin: 0 auto;
    padding: var(--space-4) var(--space-2);
  }

  h1 {
    font-size: 1.4em;
    margin: 0 0 var(--space-1) 0;
  }

  p.subtitle {
    color: var(--muted);
    margin: 0 0 var(--space-3) 0;
    font-size: 0.9em;
  }

  label {
    display: block;
    font-size: 0.85em;
    color: var(--muted);
    margin-bottom: var(--space-1);
  }

  input[type=text] {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: var(--space-1) var(--space-2);
    font-size: 16px;
  }

  input[type=text]:focus {
    outline: none;
    border-color: var(--accent);
  }

  .field {
    margin-bottom: var(--space-2);
  }

  button {
    background: var(--accent);
    color: #06131f;
    border: none;
    border-radius: 6px;
    padding: var(--space-1) var(--space-3);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }

  button:disabled {
    background: var(--border);
    color: var(--muted);
    cursor: not-allowed;
  }

  button:hover:not(:disabled) {
    background: #3d8fe0;
  }

  #status {
    margin-top: var(--space-2);
    font-size: 0.9em;
    min-height: 1.2em;
  }
  #status.ok { color: var(--ok); }
  #status.error { color: var(--error); }

  #log {
    margin-top: var(--space-3);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: var(--space-2);
    height: 320px;
    overflow-y: auto;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 13px;
    white-space: pre-wrap;
    color: var(--text);
  }

  h2 {
    font-size: 1.1em;
    margin: var(--space-4) 0 var(--space-2) 0;
  }

  #library {
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  .book-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: var(--space-2);
    border-bottom: 1px solid var(--border);
  }

  .book-row:last-child { border-bottom: none; }

  .book-name { word-break: break-all; }

  .book-size {
    color: var(--muted);
    font-size: 0.85em;
    margin-left: var(--space-2);
    flex-shrink: 0;
  }

  a.download {
    color: var(--accent);
    text-decoration: none;
    margin-left: var(--space-2);
    flex-shrink: 0;
  }

  a.download:hover { text-decoration: underline; }

  .empty {
    color: var(--muted);
    padding: var(--space-2);
    font-size: 0.9em;
  }
</style>
</head>
<body>
<main>
  <h1>BlogScraper</h1>
  <p class="subtitle">Scrape a lit-com-style story or series into an EPUB.</p>

  <div class="field">
    <label for="url">Chapter or series URL</label>
    <input type="text" id="url" placeholder="https://www.literotica.com/s/story-ch-01 or /series/se/12345">
  </div>

  <div class="field">
    <label for="author">Author (optional)</label>
    <input type="text" id="author" placeholder="Unknown Author">
  </div>

  <button id="start">Start Scrape</button>
  <div id="status"></div>

  <div id="log"></div>

  <h2>Library</h2>
  <div id="library"></div>
</main>

<script>
const startBtn = document.getElementById('start');
const urlInput = document.getElementById('url');
const authorInput = document.getElementById('author');
const statusEl = document.getElementById('status');
const logEl = document.getElementById('log');
const libraryEl = document.getElementById('library');

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = cls || '';
}

function appendLog(line) {
  logEl.textContent += (logEl.textContent ? '\n' : '') + line;
  logEl.scrollTop = logEl.scrollHeight;
}

async function loadLibrary() {
  const res = await fetch('/library');
  const books = await res.json();
  libraryEl.innerHTML = '';
  if (books.length === 0) {
    libraryEl.innerHTML = '<div class="empty">No EPUBs yet.</div>';
    return;
  }
  for (const b of books) {
    const row = document.createElement('div');
    row.className = 'book-row';
    row.innerHTML = `
      <span class="book-name">${b.name}</span>
      <span style="display:flex;align-items:center;">
        <span class="book-size">${b.size_kb} KB</span>
        <a class="download" href="/library/${encodeURIComponent(b.name)}">Download</a>
      </span>
    `;
    libraryEl.appendChild(row);
  }
}

function streamLog() {
  const source = new EventSource('/stream');
  source.onmessage = (e) => {
    if (e.data.startsWith('__DONE__')) {
      const code = e.data.replace('__DONE__', '');
      source.close();
      startBtn.disabled = false;
      if (code === '0') {
        setStatus('Done.', 'ok');
        loadLibrary();
      } else {
        setStatus(`Scraper exited with code ${code}.`, 'error');
      }
      return;
    }
    appendLog(e.data);
  };
  source.onerror = () => {
    source.close();
    startBtn.disabled = false;
  };
}

startBtn.addEventListener('click', async () => {
  const url = urlInput.value.trim();
  if (!url) {
    setStatus('Enter a URL first.', 'error');
    return;
  }
  startBtn.disabled = true;
  logEl.textContent = '';
  setStatus('Scraping…');

  const res = await fetch('/scrape', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ url, author: authorInput.value.trim() }),
  });

  if (!res.ok) {
    const err = await res.json();
    setStatus(err.error || 'Failed to start.', 'error');
    startBtn.disabled = false;
    return;
  }

  streamLog();
});

loadLibrary();
</script>
</body>
</html>
